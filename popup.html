<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e2e;
      color: #f5f5f7;
      margin: 0;
      padding: 16px;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 10px;
    }
    p {
      font-size: 12px;
      opacity: 0.8;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      margin-right: 4px;
    }
    .claude { background: #d97757; color: #1e1e2e; }
    .chatgpt { background: #74aa9c; color: #1e1e2e; }
  </style>
</head>
<body>
  <h2>🧮 AI Token Usage Tracker</h2>
  <p>
    <span class="badge claude">Claude</span>
    <span class="badge chatgpt">ChatGPT</span>
  </p>
  <p>
    A floating widget shows estimated token usage on Claude.ai and
    ChatGPT pages. Click the widget to collapse/expand it.
  </p>
  <p>Note: token counts are approximations (~4 chars/token heuristic), not exact API counts.</p>
</body>
</html>
